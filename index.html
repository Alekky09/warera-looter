<style>

.region-distance{position:absolute;top:14px;right:16px;text-align:right;color:#94a3b8;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.55px}.card{position:relative}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px}.card{padding:24px;border-radius:20px;background:var(--card);border:1px solid rgba(255,255,255,.06);box-shadow:0 4px 24px #0003;transition:.25s}.card:hover{transform:translateY(-3px);border-color:#ffffff1c}.card-head{text-align:center;margin-bottom:20px}.card h3{margin:0 0 6px;font-size:20px}.meta{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.sides{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:8px}.side{display:flex;flex-direction:column;font-weight:700;font-size:13px}.side.def{color:#93c5fd;align-items:flex-start}.side.att{color:#fca5a5;align-items:flex-end;text-align:right}.pts{color:var(--muted);font-size:10px;margin-top:2px}.match-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px}.series-score{color:#e2e8f0;font-size:14px;font-weight:900;line-height:1}.series-score span{color:#94a3b8;font-weight:600;font-size:9px}.eta{font-size:10px;font-style:italic;color:#94a3b8;white-space:nowrap;text-align:center}

</style></head><body><div class="container">
<div class="top-row"><div id="player" class="player-card" style="display:none"></div><div class="header"><h1>WarEra Battle Report</h1><div class="subtitle"><span id="generated">Not loaded</span><span class="badge" id="sortBadge">Ordered by lowest GREEN threshold</span></div></div></div>
<div class="controls"><div class="row"><input id="key" class="input" type="password" placeholder="Paste WarEra API key"><div class="player-search"><input id="playerSearch" class="input" type="text" placeholder="Search player by name" autocomplete="off"><div id="playerResults" class="player-results" style="display:none"></div></div><button id="load">Load battles</button></div>
<div class="options"><label><input id="remember" type="checkbox"> Remember API key in this browser</label><button id="clear" class="secondary">Clear saved key</button><label>Sort by <select id="sort" class="select"><option value="green">Green</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="gold">Gold</option><option value="red">Red</option></select></label></div><div id="status" class="status"></div></div>
<div id="grid" class="grid"><div class="empty">Enter your API key and click “Load battles”.</div></div><div id="footer" class="footer"></div></div>
<script>
const API="https://api2.warera.io/trpc", WEAPONS={jet:6,tank:5,sniper:4,rifle:3,gun:2}, TIER={2:"green",3:"blue",4:"purple",5:"gold",6:"red"};
const $=id=>document.getElementById(id), els={key:$("key"),remember:$("remember"),load:$("load"),clear:$("clear"),sort:$("sort"),status:$("status"),grid:$("grid"),generated:$("generated"),badge:$("sortBadge"),footer:$("footer"),playerSearch:$("playerSearch"),playerResults:$("playerResults"),player:$("player")};
let reports=[], sortKey="green", player=null, regionsMap={}, regionGraph={}, regionDistances={}, selectedPlayerId="", playerSearchTimer=null, playerSearchToken=0;
const saved=localStorage.getItem("warera_api_key");if(saved){els.key.value=saved;els.remember.checked=true}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function compact(v){v=Number(v)||0;let a=Math.abs(v);if(a>=1e9)return(v/1e9).toFixed(1).replace(".0","")+"B";if(a>=1e6)return(v/1e6).toFixed(1).replace(".0","")+"M";if(a>=1e3)return(v/1e3).toFixed(1).replace(".0","")+"K";return Math.trunc(v).toLocaleString()}
function status(m,c=""){els.status.className="status "+c;els.status.innerHTML=m}
async function post(path,payload,key){let r=await fetch(`${API}/${path}`,{method:"POST",headers:{"X-API-Key":key,"accept":"*/*","Content-Type":"application/json"},body:JSON.stringify(payload)});let t=await r.text(),d;try{d=JSON.parse(t)}catch{throw Error(`API returned non-JSON response (${r.status})`)}if(!r.ok||d?.error)throw Error(d?.error?.json?.message||d?.error?.message||`HTTP ${r.status}`);return d.result.data}
function nextCursor(cur,step){if(!cur?.startsWith("v2."))return cur;try{let b=cur.slice(3)+"=".repeat((4-cur.slice(3).length%4)%4),bin=atob(b.replace(/-/g,"+").replace(/_/g,"/")),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),d=JSON.parse(new TextDecoder().decode(bytes));d[0].v+=step;d[1].v=(BigInt("0x"+d[1].v)+BigInt(step)).toString(16);let out=btoa(new TextEncoder().encode(JSON.stringify(d)).reduce((x,b)=>x+String.fromCharCode(b),""));return"v2."+out.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch{return cur}}
async function userById(id,key){return post("user.getUserById",{userId:id},key)}
async function searchPlayers(query,key){return post("search.searchAnything",{searchText:query},key)}
function hidePlayerResults(){els.playerResults.style.display="none";els.playerResults.innerHTML=""}
function showPlayerResults(html){els.playerResults.innerHTML=html;els.playerResults.style.display="block"}
async function searchPlayerInput(){let query=els.playerSearch.value.trim(),key=els.key.value.trim(),token=++playerSearchToken;selectedPlayerId="";player=null;renderPlayer();if(query.length<2){hidePlayerResults();return}if(!key){showPlayerResults(`<div class="player-search-status">Enter your API key first.</div>`);return}showPlayerResults(`<div class="player-search-status">Searching...</div>`);try{let result=await searchPlayers(query,key);if(token!==playerSearchToken)return;let ids=result?.userIds||[];if(!ids.length){showPlayerResults(`<div class="player-search-status">No players found.</div>`);return}let users=await Promise.all(ids.slice(0,8).map(id=>userById(id,key).catch(()=>null)));if(token!==playerSearchToken)return;users=users.filter(Boolean);if(!users.length){showPlayerResults(`<div class="player-search-status">No players found.</div>`);return}showPlayerResults(users.map(u=>`<div class="player-result" data-player-id="${esc(u._id)}"><div class="player-result-name">${esc(u.username||u._id)}</div><div class="player-result-id">${esc(u._id)}</div></div>`).join(""));els.playerResults.querySelectorAll(".player-result").forEach(el=>el.onclick=()=>selectPlayer(el.dataset.playerId));}catch(e){if(token===playerSearchToken)showPlayerResults(`<div class="player-search-status">Search failed: ${esc(e.message)}</div>`)} }
async function selectPlayer(id){let key=els.key.value.trim();if(!key||!id)return;selectedPlayerId=id;hidePlayerResults();try{player=await userById(id,key);buildRegionDistances(player.location);els.playerSearch.value=player.username||id;renderPlayer();if(reports.length)render()}catch(e){player=null;renderPlayer();status(`Unable to load player: ${esc(e.message)}`,"error")}}
async function countries(key){let x=await post("country.getAllCountries",{},key);return Object.fromEntries(x.map(v=>[v._id,v.name]))}
async function regions(key){
  let x=await post("region.getRegionsObject",{},key), names={}, graph={};
  function neighborIds(value){
    if(Array.isArray(value)) return value.flatMap(v=>neighborIds(v));
    if(typeof value==="string"||typeof value==="number") return [String(value)];
    if(value&&typeof value==="object") return [value._id,value.id,value.regionId,value.region_id].filter(v=>v!==undefined&&v!==null).map(String);
    return []
  }
  for(const [id,v] of Object.entries(x)){
    names[id]=v?.name??id;
    graph[id]=[];
    let neighbors=v?.neighbors??v?.neighbours??v?.neighboringRegions??v?.neighbouringRegions??v?.adjacentRegions??[];
    if(neighbors&&!Array.isArray(neighbors)&&typeof neighbors==="object") neighbors=Object.keys(neighbors);
    graph[id]=neighborIds(neighbors).filter(n=>n!==id);
  }
  for(const [id,neighbors] of Object.entries(graph)) for(const n of neighbors){
    if(!graph[n])graph[n]=[];
    if(!graph[n].includes(id))graph[n].push(id)
  }
  return{names,graph}
}
function buildRegionDistances(start){
  regionDistances={};
  if(!start||!regionGraph[start])return;
  let queue=[start];
  regionDistances[start]=0;
  for(let i=0;i<queue.length;i++){
    let current=queue[i];
    for(const neighbor of regionGraph[current]||[]){
      if(regionDistances[neighbor]===undefined){
        regionDistances[neighbor]=regionDistances[current]+1;
        queue.push(neighbor)
      }
    }
  }
}
function regionDistanceText(regionId){
  if(!player||regionId===undefined||regionId===null)return"";
  let d=regionDistances[String(regionId)];
  return d===undefined?"Distance unavailable":`${d} ${d===1?"region":"regions"} away`
}
async function ranking(payload,key){return post("battleRanking.getRanking",payload,key)}
async function thresholds(payload,key,out){let page=await ranking(payload,key), n=page.itemCount||0, last=0, stop=false;function take(items){for(const w of items){if(!w?.lootItem){stop=true;return}last=w.rank;let code=w.lootItem.code,t=WEAPONS[code]??parseInt(String(code).slice(-1),10);if(TIER[t])out[TIER[t]]=w.value}}take(page.items||[]);let cur=page.nextCursor,limit=100;if(stop||!cur||(page.items||[]).length<limit)return{participants:n,rank:last};let base=cur;while(!stop){let curs=[0,1,2,3,4].map(i=>nextCursor(base,i*limit));let pages=await Promise.all(curs.map(c=>ranking({...payload,cursor:c},key).catch(()=>null)));for(const pg of pages){if(!pg||(pg.items||[]).length===0){stop=true;break}take(pg.items||[]);if(stop||(pg.items||[]).length<limit){stop=true;break}}if(!stop)base=nextCursor(base,5*limit)}return{participants:n,rank:last}}
async function report(b,countriesMap,regionsMap,key){let round=b.currentRound,thr={},overall={};let common={dataType:"damage",type:"user",side:"merged",limit:100};let [r,o]=await Promise.all([thresholds({...common,roundId:round._id},key,thr),thresholds({...common,battleId:b._id},key,overall)]);let roundDamage=(+round.defender?.damages||0)+(+round.attacker?.damages||0),battleDamage=(+b.defender?.damages||0)+(+b.attacker?.damages||0);if(battleDamage===0){let roundsDamage=(b.rounds||[]).reduce((sum,rr)=>sum+(+rr?.defender?.damages||0)+(+rr?.attacker?.damages||0),0);battleDamage=roundsDamage||roundDamage}return{regionId:b.defender.region,region:regionsMap[b.defender.region]??b.defender.region,attacker:countriesMap[b.attacker.country]??b.attacker.country,defender:countriesMap[b.defender.country]??b.defender.country,participants:o.participants||0,round_participants:r.participants||0,rank:r.rank||0,need:0,thresholds:thr,overall_thresholds:overall,round_loot_quantity:Math.floor(roundDamage/200000),battle_loot_quantity:Math.floor(battleDamage/500000),round_damage:roundDamage,battle_damage:battleDamage,defender_damages:round.defender?.damages||0,defender_points:round.defender?.points||0,attacker_damages:round.attacker?.damages||0,attacker_points:round.attacker?.points||0,defender_won_rounds:b.defender?.wonRoundsCount||0,attacker_won_rounds:b.attacker?.wonRoundsCount||0,round_number:(b.rounds||[]).length}}
async function battles(key,countriesMap,regionsMap){let payload={isActive:true,limit:100,direction:"forward",filter:"all"},p=await post("battle.getBattles",payload,key),all=p.items||[],cur=p.nextCursor;if(cur&&all.length===100){let base=cur,done=false;while(!done){let pages=await Promise.all([0,1,2,3,4].map(i=>post("battle.getBattles",{...payload,cursor:nextCursor(base,i*100)},key).catch(()=>null)));for(const pg of pages){if(!pg||!pg.items?.length){done=true;break}all.push(...pg.items);if(pg.items.length<100){done=true;break}}if(!done)base=nextCursor(base,500)}}let eligible=all.filter(b=>b.type!=="tournament");status(`Calculating loot thresholds for ${eligible.length} active battles...`);return(await Promise.all(eligible.map(b=>report(b,countriesMap,regionsMap,key).catch(()=>null)))).filter(Boolean)}
function eta(b){let d=b.defender_points,a=b.attacker_points;if(d>=300||a>=300)return{m:0,side:d>=300?b.defender:b.attacker};let side;if(d===a){if(d===0&&a===0){let dd=+b.defender_damages||0,ad=+b.attacker_damages||0;if(dd===ad)return{m:null,side:null};side=dd>ad?"d":"a"}else{return{m:null,side:null}}}else side=d>a?"d":"a";let x=d,y=a,t=0;while(Math.max(x,y)<300&&t<1000){let total=x+y,g=total>500?6:total>400?5:total>300?4:total>200?3:total>100?2:1;if(side==="d")x+=g;else y+=g;t++}return{m:t*2,side:side==="d"?b.defender:b.attacker}}
function etaText(e){if(e.m===null)return"ETA unavailable";if(e.m===0)return"Round complete";let h=Math.floor(e.m/60),m=e.m%60;return h?(m?`~${h}h ${m}m`:`~${h}h`):`~${m} min`}
function thresholdHtml(th,title){if(!th||!Object.keys(th).length)return"";let order={green:1,blue:2,purple:3,gold:4,red:5}, entries=Object.entries(th).sort((a,b)=>(order[a[0]]||99)-(order[b[0]]||99)), vals=entries.map(x=>Number(x[1])||1), min=Math.min(...vals),max=Math.max(...vals);let log=(v)=>max===min?100:15+((Math.log10(Math.max(v,1))-Math.log10(min))/(Math.log10(max)-Math.log10(min)))*85;return `<div class="ttitle">${esc(title)}</div>`+entries.map(([tier,v])=>`<div class="trow ${tier}"><span class="tier">${tier}</span><div class="track"><div class="fill" style="width:${log(Number(v)).toFixed(1)}%"></div></div><span class="num">${esc(compact(v))}</span></div>`).join("")}
function lootSortInfo(b,tier){let has=Number.isFinite(Number(b.thresholds?.[tier]));if(has)return{group:1,value:Number(b.thresholds[tier])||Infinity,label:"threshold"};let loot=b.round_loot_quantity||0,participants=b.round_participants||0;if(loot>participants)return{group:0,value:0,label:"too_much"};if(loot<participants)return{group:2,value:0,label:"too_little"};return{group:1,value:0,label:"balanced"}}
function lootDiagnosisHtml(b,tier){if(Number.isFinite(Number(b.thresholds?.[tier])))return"";let loot=b.round_loot_quantity||0,participants=b.round_participants||0;if(loot>participants)return`<span class="loot-diagnosis much">Too much loot</span>`;if(loot<participants)return`<span class="loot-diagnosis little">Not enough loot</span>`;return`<span class="loot-diagnosis balanced">Loot matches players</span>`}
function lootMeta(b){return`<div class="loot-meta"><span>Round: <b>${(b.round_participants||0).toLocaleString()}</b> players / <b>${(b.round_loot_quantity||0).toLocaleString()}</b> loot</span><span>Battle: <b>${(b.participants||0).toLocaleString()}</b> players / <b>${(b.battle_loot_quantity||0).toLocaleString()}</b> loot</span></div>`}
function renderPlayer(){if(!player){els.player.style.display="none";return}let h=player.skills?.health?.currentBarValue??0,ht=player.skills?.health?.total??0,s=player.skills?.stamina?.currentBarValue??0,st=player.skills?.stamina?.total??0,region=regionsMap?.[player.location]??player.location??"Unknown";els.player.innerHTML=`<div class="player-title">Selected player</div><div class="player-name">${esc(player.username||player._id)}</div><div class="player-region">${esc(region)}</div><div class="player-stats"><div class="player-stat"><div class="player-stat-label">Health</div><div class="player-stat-value">${Number(h).toFixed(1)} / ${esc(ht)}</div></div><div class="player-stat"><div class="player-stat-label">Stamina</div><div class="player-stat-value">${Number(s).toFixed(1)} / ${esc(st)}</div></div></div>`;els.player.style.display="block"}
function render(){let sorted=[...reports].sort((a,b)=>{let x=lootSortInfo(a,sortKey),y=lootSortInfo(b,sortKey);return x.group-y.group||x.value-y.value});let missingCount=sorted.filter(b=>!Number.isFinite(Number(b.thresholds?.[sortKey]))).length;els.badge.textContent=missingCount&&sortKey?`Ordered by ${sortKey.toUpperCase()} threshold + loot availability`: `Ordered by lowest ${sortKey.toUpperCase()} threshold`;if(!sorted.length){els.grid.innerHTML=`<div class="empty">No active battles could be loaded.</div>`;return}els.grid.innerHTML=sorted.map(b=>{let dd=+b.defender_damages||0,ad=+b.attacker_damages||0,dp=+b.defender_points||0,ap=+b.attacker_points||0,total=dd+ad,dpct=Math.min(dp/300*100,100),apct=Math.min(ap/300*100,100),ddpct=total?dd/total*100:50,adpct=total?ad/total*100:50,e=eta(b);return `<div class="card"><div class="region-distance">${esc(regionDistanceText(b.regionId))}</div><div class="card-head"><h3>${esc(b.region)}</h3><div class="meta">ROUND ${b.round_number||1}<span> • </span>${(b.participants||0).toLocaleString()} PLAYERS</div>${lootDiagnosisHtml(b,sortKey)}</div>${lootMeta(b)}<div class="sides"><div class="side def">${esc(b.defender)}<span class="pts">${dp.toLocaleString()} / 300 PTS</span></div><div class="match-center"><div class="series-score">${b.defender_won_rounds||0} – ${b.attacker_won_rounds||0}</div><div class="eta">${esc(etaText(e))}</div></div><div class="side att">${esc(b.attacker)}<span class="pts">${ap.toLocaleString()} / 300 PTS</span></div></div><div class="points"><div class="pfill def" style="width:${dpct/2}%"></div><div class="pfill att" style="width:${apct/2}%"></div><div class="center"></div></div><div class="damage"><div class="def" style="width:${ddpct}%">${compact(dd)}</div><div class="att" style="width:${adpct}%">${compact(ad)}</div></div><div class="thresholds">${thresholdHtml(b.thresholds,`Round ${b.round_number||1} Loot`)}${thresholdHtml(b.overall_thresholds,"Overall Battle Loot")}</div></div>`}).join("");els.footer.textContent=`${sorted.length} active battles being tracked`}
async function load(){let key=els.key.value.trim();if(!key){status("Please enter an API key.","error");return}if(els.remember.checked)localStorage.setItem("warera_api_key",key);else localStorage.removeItem("warera_api_key");els.load.disabled=true;els.grid.innerHTML=`<div class="empty">Loading...</div>`;try{let[c,r]=await Promise.all([countries(key),regions(key)]);regionsMap=r.names;regionGraph=r.graph;player=selectedPlayerId?await userById(selectedPlayerId,key):null;buildRegionDistances(player?.location);renderPlayer();reports=await battles(key,c,r.names);render();els.generated.textContent=`Generated ${new Date().toLocaleString()}`;status(`Loaded ${reports.length} active battles.`,"ok")}catch(e){console.error(e);status(`Error: ${esc(e.message)}`,"error");els.grid.innerHTML=`<div class="empty">Unable to load the battle report.</div>`}finally{els.load.disabled=false}}
els.playerSearch.oninput=()=>{clearTimeout(playerSearchTimer);playerSearchTimer=setTimeout(searchPlayerInput,250)};
els.playerSearch.onfocus=()=>{if(els.playerSearch.value.trim().length>=2&&els.playerResults.innerHTML)els.playerResults.style.display="block"};
els.load.onclick=load;els.key.onkeydown=e=>{if(e.key==="Enter")load()};els.sort.onchange=()=>{sortKey=els.sort.value;if(reports.length)render()};els.clear.onclick=()=>{localStorage.removeItem("warera_api_key");els.key.value="";els.remember.checked=false;selectedPlayerId="";player=null;els.playerSearch.value="";hidePlayerResults();renderPlayer();status("Saved API key cleared.")};
document.addEventListener("click",e=>{if(!e.target.closest(".player-search"))hidePlayerResults()});
</script></body></html>
