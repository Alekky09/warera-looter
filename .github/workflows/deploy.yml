name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    enviroment:
      name: github-pages
      url: ${{ steps.deployment.output.page_url }}
    runs-on: ubuntu-latest

  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node.jobs
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Build minified file
      run: npm run build

    - name: Setup pages
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./dist

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
